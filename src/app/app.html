<header class="app-header">
  <div class="header-inner">
    <a class="brand" routerLink="/claimant/submit">
      <span class="brand-mark">C</span>

      <span class="brand-text">
        <strong>Chubb Claims</strong>
        <small>APAC Claims Portal</small>
      </span>
    </a>

    <div class="header-actions">
      <div
        class="role-switch"
        role="group"
        aria-label="Select user role"
      >
        <button
          type="button"
          [class.active]="selectedRole === 'CLAIMANT'"
          [attr.aria-pressed]="selectedRole === 'CLAIMANT'"
          (click)="switchRole('CLAIMANT')"
        >
          Claimant
        </button>

        <button
          type="button"
          [class.active]="selectedRole === 'OFFICER'"
          [attr.aria-pressed]="selectedRole === 'OFFICER'"
          (click)="switchRole('OFFICER')"
        >
          Claims Officer
        </button>
      </div>

      <nav aria-label="Main navigation">
        @if (selectedRole === 'CLAIMANT') {
          <a
            routerLink="/claimant/submit"
            routerLinkActive="active"
          >
            Submit claim
          </a>

          <a
            routerLink="/claimant/claims"
            routerLinkActive="active"
          >
            Track claims
          </a>
        } @else {
          <a
            routerLink="/officer/dashboard"
            routerLinkActive="active"
          >
            Officer dashboard
          </a>
        }
      </nav>
    </div>
  </div>
</header>

<main class="app-content">
  <router-outlet></router-outlet>
</main>
